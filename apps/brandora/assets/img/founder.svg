<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 800" role="img"
     aria-label="Portrait of Affriee Darele Yvana — photograph pending">
  <title>Affriee Darele Yvana</title>
  <!--
    A placeholder, and honest about being one.

    The founder's photograph replaces this file. Until it does, the section
    still has to look finished — a broken image icon, or a grey box with a
    camera glyph, reads as a site nobody maintains. So this is a composed
    monogram in the brand's own palette: it holds the frame, it is clearly not
    a photograph, and it does not pretend to be a stock person either.

    To swap it: drop the photograph in as founder.jpg and change the two
    references in index.html. Aspect ratio 4:5, at least 640×800.
  -->
  <defs>
    <linearGradient id="f-field" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#1A1424"/>
      <stop offset="55%" stop-color="#0D0A14"/>
      <stop offset="100%" stop-color="#070610"/>
    </linearGradient>
    <linearGradient id="f-rim" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0%" stop-color="#B98BE8"/>
      <stop offset="45%" stop-color="#7650A5"/>
      <stop offset="100%" stop-color="#4B167A"/>
    </linearGradient>
    <radialGradient id="f-glow" cx="0.5" cy="0.38" r="0.62">
      <stop offset="0%" stop-color="#7650A5" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#7650A5" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="640" height="800" fill="url(#f-field)"/>
  <rect width="640" height="800" fill="url(#f-glow)"/>

  <!-- The initials, set the way the wordmark is. -->
  <text x="320" y="392" text-anchor="middle" fill="url(#f-rim)"
        font-family="Georgia, 'Times New Roman', 'Didot', serif"
        font-size="150" letter-spacing="10">ADY</text>

  <text x="320" y="452" text-anchor="middle" fill="#E8E4EF" opacity="0.72"
        font-family="Inter, 'Helvetica Neue', Arial, sans-serif"
        font-size="19" font-weight="500" letter-spacing="7">FOUNDER</text>

  <line x1="220" y1="500" x2="420" y2="500" stroke="#7650A5" stroke-width="1" opacity="0.5"/>

  <text x="320" y="540" text-anchor="middle" fill="#A79FBA" opacity="0.75"
        font-family="Inter, 'Helvetica Neue', Arial, sans-serif"
        font-size="17" letter-spacing="1.5">Abidjan, Côte d'Ivoire</text>
</svg>
